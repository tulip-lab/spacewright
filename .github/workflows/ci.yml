name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: brew install fish jq
      - name: Run release checks
        run: fish scripts/check.fish
